- id: tools
  config:
    mode: native

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: ptc-runtime
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: storage-domain
  config:
    backend: sqlite

- insert:
    - id: security-browser-use
      name: '@deepseek-ai/dsh-browser-use'
      disabled: true
    - id: security-browser-playwright
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      disabled: true
      config:
        mode: launch
        headless: true
    - id: security-storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('security/domain.sqlite')
    - id: security-workbench
      name: '@deepseek-ai/dsh-experimental-security-analysis'
      config:
        analysisTurnTokens: 360000
        maxDurationMs: 1800000
        maxDerivedAssets: 1024
        evolution:
          auto: true
        environmentConfigurationPath: !!js process.cwd() + '/.dsh/security-environments.json'
        toolCatalogPath: !!js process.cwd() + '/.dsh/security-tool-packs.json'
        toolConfiguration:
          path: !!js >-
            process.getBuiltinModule('node:fs').existsSync(process.cwd() + '/.dsh/security-tools.json') || !process.getBuiltinModule('node:fs').existsSync(dshHomePath('security/tools.json')) ? process.cwd() + '/.dsh/security-tools.json' : dshHomePath('security/tools.json')
          environmentId: local
        root: !!js dshHomePath('security')
        importRoots: !!js '[process.cwd()]'
        taskIntake:
          workspaces: []
          defaultEnvironmentIds: [local]
          maxAttempts: 3
        environments:
          - id: local
            kind: local
            label: Local reverse analysis
            cwd: !!js process.cwd()
            tools:
              - id: python
                command: python
                versionArgs: [--version]
                source: Operator installation with Frida bindings
              - id: jadx
                command: jadx
                versionArgs: [--version]
                source: Operator JADX installation
              - id: adb
                command: adb
                versionArgs: [version]
                source: Android platform tools
              - id: fastboot
                command: fastboot
                versionArgs: [--version]
                source: Android platform tools; inventory only
              - id: john
                command: john
                versionArgs: [--list=build-info]
                source: Operator audit tools; inventory only
          # Managed mining container for sanitizer builds and PoC differential runs.
          # The image must already exist locally; the dsh toolbox recipe builds one.
          - id: mining
            kind: docker
            label: Mining sanitizer builds
            cwd: !!js process.cwd()
            image: dsh-security-toolbox:latest
            tools:
              - id: docker
                command: docker
                versionArgs: [--version]
                source: Operator Docker installation
              - id: python
                command: python3
                versionArgs: [--version]
                source: Toolbox image
              - id: cmake
                command: cmake
                versionArgs: [--version]
                source: Toolbox image
              - id: make
                command: make
                versionArgs: [--version]
                source: Toolbox image
              - id: gcc
                command: gcc
                versionArgs: [--version]
                source: Toolbox image
              - id: clang
                command: clang
                versionArgs: [--version]
                source: Toolbox image
              - id: pkg-config
                command: pkg-config
                versionArgs: [--version]
                source: Toolbox image
    - id: security-environments
      name: '@deepseek-ai/dsh-experimental-security-analysis/environment'
    - id: security-ghidra
      name: '@deepseek-ai/dsh-experimental-security-analysis/ghidra'
      config:
        programs: []
    - id: security-native
      name: '@deepseek-ai/dsh-experimental-security-analysis/native'
    - id: security-offline
      name: '@deepseek-ai/dsh-experimental-security-analysis/offline'
    - id: security-packet-capture
      name: '@deepseek-ai/dsh-experimental-security-analysis/packet-capture'
    - id: security-mining
      name: '@deepseek-ai/dsh-experimental-security-analysis/mining'
    - id: security-frida
      name: '@deepseek-ai/dsh-experimental-security-analysis/frida'
    - id: security-android
      name: '@deepseek-ai/dsh-experimental-security-analysis/android'
    - id: security-operator-commands
      name: '@deepseek-ai/dsh-experimental-security-analysis/commands'

    - id: security-web
      name: '@deepseek-ai/dsh-experimental-security-analysis/web'
    - id: security-external-web
      name: '@deepseek-ai/dsh-experimental-security-analysis/external-web'
    - id: security-laboratory
      name: '@deepseek-ai/dsh-experimental-security-analysis/laboratory'

- id: webserver
  inject: [webStartup]
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3081
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: agent-preset-registry
  config:
    default: security

- insert:
    - id: security-presets
      name: '@deepseek-ai/dsh-experimental-security-profile'
    - id: ui-security-workbench
      name: '@deepseek-ai/dsh-experimental-client-ui-security-analysis'
    - id: helper
      name: '@deepseek-ai/dsh-helper'
      config:
        enabled: false
    - id: helper-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex
        consultation: true
    - id: ui-helper
      name: '@deepseek-ai/dsh-client-ui-helper'
