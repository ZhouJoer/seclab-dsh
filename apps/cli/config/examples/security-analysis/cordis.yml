# Apply after the security Host bundle. Tool paths are explicit operator configuration.
- id: security-workbench
  config:
    analysisTurnTokens: 360000
    maxDurationMs: 1800000
    evolution:
      auto: true
    root: !!js dshHomePath('security')
    importRoots: !!js '[process.cwd()]'
    taskIntake:
      workspaces: []
      defaultEnvironmentIds: [local]
      maxAttempts: 3
    environments:
      - id: local
        kind: local
        label: Local reverse analysis
        cwd: !!js process.cwd()
        tools:
          - id: python
            command: python
            versionArgs: [--version]
            source: Operator installation with Frida bindings
          - id: jadx
            command: jadx
            versionArgs: [--version]
            source: Operator JADX installation
          - id: adb
            command: adb
            versionArgs: [version]
            source: Android platform tools
          - id: fastboot
            command: fastboot
            versionArgs: [--version]
            source: Android platform tools; inventory only
          - id: john
            command: john
            versionArgs: [--list=build-info]
            source: Operator audit tools; inventory only
      # Managed mining container for sanitizer builds and PoC differential runs.
      # The image must already exist locally; the dsh toolbox recipe builds one.
      - id: mining
        kind: docker
        label: Mining sanitizer builds
        cwd: !!js process.cwd()
        image: dsh-security-toolbox:latest
        tools:
          - id: docker
            command: docker
            versionArgs: [--version]
            source: Operator Docker installation
          - id: python
            command: python3
            versionArgs: [--version]
            source: Toolbox image
          - id: cmake
            command: cmake
            versionArgs: [--version]
            source: Toolbox image
          - id: make
            command: make
            versionArgs: [--version]
            source: Toolbox image
          - id: gcc
            command: gcc
            versionArgs: [--version]
            source: Toolbox image
          - id: clang
            command: clang
            versionArgs: [--version]
            source: Toolbox image
          - id: pkg-config
            command: pkg-config
            versionArgs: [--version]
            source: Toolbox image
