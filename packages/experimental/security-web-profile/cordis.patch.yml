- id: webserver
  inject: [webStartup]
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3081
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: agent-preset-registry
  config:
    default: security

- insert:
    - id: security-presets
      name: '@deepseek-ai/dsh-experimental-security-profile'
    - id: ui-security-workbench
      name: '@deepseek-ai/dsh-experimental-client-ui-security-analysis'
    - id: helper
      name: '@deepseek-ai/dsh-helper'
      config:
        enabled: false
    - id: helper-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex
        consultation: true
    - id: ui-helper
      name: '@deepseek-ai/dsh-client-ui-helper'
