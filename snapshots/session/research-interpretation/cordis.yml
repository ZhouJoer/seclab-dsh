# This authored scenario uses only recorded model responses and bounded synthetic tools.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: session-title-llm
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand: [bash, -c, 'while [ "$1" != "--" ]; do shift; done; shift; exec "$@"', passthrough-runner]
    runnerFailureSignatures: ['passthrough-runner: profile rejected']
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                reasoningEfforts: [high, low]
    - id: helper
      name: '@deepseek-ai/dsh-helper'
      config:
        enabled: true
        mode: proactive
        backend: api
        provider: deepseek-official
        model: deepseek-v4-flash
        reasoningEffort: low
    - id: research-interpretation-fixture
      name: './fixture.mjs'
    - id: research-interpretation-review
      name: '../../../.dsh/flare-context-study/direction-review/index.mjs'
      config:
        enabled: true
        workspace: !!js process.cwd()
        provider: deepseek-official
        model: deepseek-v4-flash
        recoveryEnabled: false
        handoffReviewEnabled: false
        completionReviewEnabled: false
        adoptionReviewEnabled: false
        automaticInterpretationTools: [pwsh]
        automaticExperimentSourceTools: [native_observe]
        automaticExperimentSourceOperations: [fixture.records]
        adoptionTools: [pwsh]
        checkTools: [pwsh]
